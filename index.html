<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПРИП → KML</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  margin:0;padding:16px;
  background:#121212;
  color:#e0e0e0;
}
h1{font-size:1.4em;margin:0 0 8px;color:#64b5f6}
.container{max-width:720px;margin:0 auto}
textarea{
  width:100%;min-height:150px;padding:12px;
  border:1px solid #444;border-radius:8px;
  background:#1e1e1e;color:#e0e0e0;
  font-family:inherit;font-size:14px;resize:vertical;
}
textarea:focus{outline:none;border-color:#64b5f6}
button{
  padding:12px 20px;border:none;border-radius:8px;
  background:#0d6efd;color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;
  margin:8px 4px 0 0;transition:background 0.2s;
}
button:hover{background:#0b5ed7}
button:disabled{background:#333;color:#777;cursor:not-allowed}
button.danger{background:#ef4444;color:#fff}
button.danger:hover{background:#dc2626}
.preview{margin:16px 0}
.card{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:8px}
.card h3{margin:0 0 8px;font-size:1em;color:#64b5f6}
.card p{margin:4px 0;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;background:#1e3a8a;color:#93c5fd;font-size:12px}
.err{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b;padding:12px;border-radius:8px;margin:8px 0;font-size:13px}
.warn{color:#fbbf24;font-size:12px;margin:4px 0}
.skip{font-size:12px;color:#777;margin:0 0 8px}
.info{font-size:12px;color:#888;margin-top:16px;line-height:1.5}
label.settings-label{
  display:inline-flex;align-items:center;font-size:13px;
  color:#ccc;margin-top:10px;cursor:pointer;
  background:#2d2d2d;padding:8px 12px;border-radius:8px;font-weight:600;
}
input[type="checkbox"]{margin-right:8px;transform:scale(1.2);cursor:pointer;accent-color:#0d6efd}
.version{text-align:right;font-size:11px;color:#555;margin-top:10px;}
.zone-box{margin-top:8px; border-top:1px dashed #444; padding-top:8px;}

/* Стили для палитры цветов */
.color-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; background:#1e1e1e; padding:8px 12px; border-radius:8px; border:1px solid #333;}
.color-picker{display:flex; align-items:center; font-size:13px; color:#ccc; font-weight:600;}
input[type="color"]{
  margin-left:6px; border:none; border-radius:4px; width:28px; height:28px;
  padding:0; background:none; cursor:pointer; vertical-align:middle;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 1px solid #555; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>ПРИП → KML</h1>
  <p style="margin:0 0 12px;color:#aaa;font-size:14px">Вставьте текст предупреждения (любых регионов). Нажмите «Обработать», затем «Скачать KML».</p>
  <textarea id="input" placeholder="ПРИП МУРМАНСК 400 КАРТА 15005 ..."></textarea>

  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
    <label class="settings-label">
      <input type="checkbox" id="sk42">
      Пулково-42 (приблизит. поправка)
    </label>
    
    <div class="color-row">
      <label class="color-picker">Контур <input type="color" id="colorLine" value="#ff0000"></label>
      <label class="color-picker">Заливка <input type="color" id="colorFill" value="#ff0000"></label>
      <label class="color-picker">Точки <input type="color" id="colorPoint" value="#00d7ff"></label>
    </div>
  </div>

  <div>
    <button id="parse">Обработать</button>
    <button id="clear" class="danger">Сброс</button>
    <button id="download" disabled>Скачать KML</button>
  </div>

  <div id="preview" class="preview"></div>
  <p class="info">
    Для официального судовождения используйте оригинальный текст ПРИП и официальную карту.
  </p>
  <div class="version">v3.1 (исправление Ю/З, дефисов, 180-го меридиана)</div>
</div>

<script>
function xmlEscape(s){return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'})[c])}
const MONTHS_FULL={'ЯНВ':'января','ФЕВ':'февраля','МАР':'марта','АПР':'апреля','МАЯ':'мая','МАЙ':'мая','ИЮН':'июня','ИЮЛ':'июля','АВГ':'августа','СЕН':'сентября','ОКТ':'октября','НОЯ':'ноября','ДЕК':'декабря'};
function monthFull(m){
  const s=(m||'').toUpperCase();
  return MONTHS_FULL[s.slice(0,3)]||s.toLowerCase();
}

function hexToKml(hex, alpha='ff') {
    if (!hex || hex.length !== 7) return alpha + '000000';
    const r = hex.slice(1, 3);
    const g = hex.slice(3, 5);
    const b = hex.slice(5, 7);
    return alpha + b + g + r;
}

// Исправлено: теперь учитывает полушарие (С/Ю, В/З)
function formatDM(deg, isLat) {
  if (deg === undefined || deg === null) return '';
  const d = Math.floor(Math.abs(deg));
  const m = (Math.abs(deg) - d) * 60;
  const dir = isLat ? (deg >= 0 ? 'С' : 'Ю') : (deg >= 0 ? 'В' : 'З');
  return `${d}° ${m.toFixed(3)}′ ${dir}`;
}

function fixOcr(text) {
  return text.replace(/\d{1,3}\s*-\s*[0-9lIiOoZz|!][0-9lIiOoZz|!.,\-]*/g, m =>
    m.replace(/[lIi|!]/g, '1').replace(/[Oo]/g, '0').replace(/[Zz]/g, '2'));
}

function extractCoordinates(text) {
    const coordRegex = /(?<![\d.,])(\d{1,3})\s*-\s*(\d{1,2}(?:[.,]\d+)?)(?!\d)(?:\s*-\s*(\d{1,2}(?:[.,]\d+)?)(?!\d))?\s*([СЮВЗNSEW](?![A-Za-zА-ЯЁа-яё]))?/gi;

    const rawTokens = [];
    let m;
    while ((m = coordRegex.exec(text)) !== null) {
        const deg = parseFloat(m[1]);
        const min = parseFloat(m[2].replace(',', '.'));
        const sec = m[3] ? parseFloat(m[3].replace(',', '.')) : 0;
        const dir = (m[4] || '').toUpperCase();

        if (min >= 60 || sec >= 60 || deg > 180) continue;

        if (!/[.,]/.test(m[2]) && !m[3] && !dir) {
            const p1 = parseInt(m[1], 10), p2 = parseInt(m[2], 10);
            if (p1 >= 1 && p1 <= 31 && p2 >= 1 && p2 <= 31) continue;
        }

        let val = deg + min/60 + sec/3600;
        if (dir === 'Ю' || dir === 'S' || dir === 'З' || dir === 'W') val = -val;
        rawTokens.push({ val, dir });
    }

    const pts = [];
    for (let i = 0; i < rawTokens.length - 1; i++) {
        const t1 = rawTokens[i], t2 = rawTokens[i+1];
        if (t1.dir === 'В' || t1.dir === 'E' || t1.dir === 'З' || t1.dir === 'W') continue;
        if (t2.dir === 'С' || t2.dir === 'N' || t2.dir === 'Ю' || t2.dir === 'S') continue;
        if (Math.abs(t1.val) <= 90 && Math.abs(t2.val) <= 180) {
            pts.push([t2.val, t1.val]);
            i++;
        }
    }
    return pts;
}

function orient(o, a, b){ return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }
function segCross(p1, p2, p3, p4){
  const d1 = orient(p3, p4, p1), d2 = orient(p3, p4, p2);
  const d3 = orient(p1, p2, p3), d4 = orient(p1, p2, p4);
  return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
         ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
}
function ringSelfIntersects(ring){
  const n = ring.length;
  for (let i = 0; i < n; i++) {
    for (let j = i + 2; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      if (segCross(ring[i], ring[(i+1)%n], ring[j], ring[(j+1)%n])) return true;
    }
  }
  return false;
}

function buildGeometry(text) {
    const circM = text.match(/РАДИУС[А-ЯЁ]*\s+([\d.,]+)\s*(МИЛ[А-ЯЁ]*|МЕТР[А-ЯЁ]*|КМ|М(?![А-ЯЁ]))/i);
    const pts = extractCoordinates(text);

    if (circM) {
        if (pts.length < 1) return null;
        const rVal = parseFloat(circM[1].replace(',', '.'));
        const rUnit = circM[2].toUpperCase();
        let radiusM = rVal;
        if (rUnit.startsWith('МИЛ')) radiusM *= 1852;
        else if (rUnit.startsWith('КМ')) radiusM *= 1000;

        const cLon = pts[0][0], cLat = pts[0][1];
        const ring = [];
        for (let i = 0; i <= 36; i++) {
            const a = (i * 10) * Math.PI / 180;
            const lat = cLat + (radiusM * Math.cos(a)) / 111320;
            const lon = cLon + (radiusM * Math.sin(a)) / (111320 * Math.cos(cLat * Math.PI / 180));
            ring.push([lon, lat]);
        }
        return { kind: 'circle', pts: ring, radiusM, cLat, cLon };
    }

    if (pts.length < 2) return null;

    const ring = pts.slice();
    const f = ring[0], l = ring[ring.length - 1];
    if (ring.length > 1 && Math.abs(f[0] - l[0]) < 1e-9 && Math.abs(f[1] - l[1]) < 1e-9) ring.pop();

    if (ring.length < 2) return null;
    if (ring.length === 2) return { kind: 'line', pts: ring };

    if (ringSelfIntersects(ring)) {
        return { kind: 'line', pts: ring, openBorder: true };
    }
    const closed = ring.slice();
    closed.push([ring[0][0], ring[0][1]]);
    
    // Проверка на переход через 180 меридиан
    const maxLon = Math.max(...ring.map(p=>p[0]));
    const minLon = Math.min(...ring.map(p=>p[0]));
    const crossesAntimeridian = (maxLon - minLon) > 180;

    return { kind: 'polygon', pts: closed, crossesAntimeridian };
}

function describeGeom(g) {
    if (g.kind === 'circle') {
        return `<p><b>Центр:</b> ${formatDM(g.cLat, true)}, ${formatDM(g.cLon, false)} (радиус ${Math.round(g.radiusM)} м)</p>`;
    }
    const list = g.pts.map((pt, i) => `${i+1}. ${formatDM(pt[1], true)}, ${formatDM(pt[0], false)}`).join('<br>');
    const label = g.kind === 'line' ? 'Линия, точек' : 'Точек распознано';
    
    let warn = '';
    if (g.openBorder) {
        warn += `<p class="warn">⚠ Замкнуть контур прямой нельзя: он самопересекается. Показана только граница по точкам ПРИП.</p>`;
    }
    if (g.crossesAntimeridian) {
        warn += `<p class="warn">⚠ Внимание! Район пересекает 180-й меридиан. В некоторых навигаторах он может отобразиться через всю карту.</p>`;
    }
    return `<p><b>${label}:</b> ${g.pts.length}</p>${warn}<p style="font-size:11px;color:#aaa;margin-top:2px">${list}</p>`;
}

function parsePointItems(after1){
  const full='1. '+after1;
  const re=/(?<=^|\s)(\d{1,2})\s*\.(?!\d)\s*/g;
  const marks=[];
  let m, expect=1;
  while((m=re.exec(full))!==null){
    if(parseInt(m[1],10)===expect){
      marks.push({n:expect,start:m.index,end:m.index+m[0].length});
      expect++;
    }
  }
  return marks.map((mk,i)=>{
    const chunk=full.slice(mk.end, i+1<marks.length?marks[i+1].start:full.length).trim();
    return {n:mk.n,chunk,pts:extractCoordinates(chunk)};
  });
}

function chunkToPoints(it){
  if(!it.pts.length)return [];
  const idx=it.chunk.search(/(?<![\d.,])\d{1,3}\s*-\s*\d{1,2}(?:[.,]\d+)?/);
  const name=(idx>0?it.chunk.slice(0,idx):'').replace(/[\s,;:\-–]+$/,'').trim();
  const nrM=it.chunk.match(/НР\s+(\d+(?:[\s,]+\d+(?![\d-]))*)/i);
  const nr=nrM?nrM[1].replace(/[\s,]+/g,', '):'';
  return it.pts.map((pt,k)=>({
    n:it.n,
    name:name||('Точка '+it.n),
    suffix:it.pts.length>1?` (точка ${k+1})`:'',
    nr,lon:pt[0],lat:pt[1]
  }));
}

function capFirst(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}

function parseOne(rawText){
  const t0=rawText.replace(/^\uFEFF/,'').replace(/\s+/g,' ').trim();
  if(!t0)return null;
  const eq=t0.indexOf('=');
  const t=(eq>=0?t0.slice(0,eq):t0).trim();
  if(!t)return null;
  const snippet=t.slice(0,160);

  // ИСПРАВЛЕНО: поддержка дефиса в названии города
  const head=t.match(/ПРИП\s+([А-ЯЁ][А-ЯЁ-]*)\s+(\d+)(?:\/\d+)?\s+КАРТ[АЫ]\s+(\d+)/i);
  if(!head){
    if(t.length<=80 && extractCoordinates(t).length===0)return {skip:true,label:t};
    return {error:'Не удалось разобрать заголовок ПРИП',snippet,pripNum:'?',mapNum:'',city:''};
  }
  const city=head[1].toUpperCase(),pripNum=head[2];

  const mapsM=t.match(/КАРТ[АЫ]\s+((?:\d+\s+)+)/i);
  const maps=mapsM?mapsM[1].trim().split(/\s+/):[head[3]];
  const mapNum=maps.join(', ');
  let rest=mapsM?t.slice(mapsM.index+mapsM[0].length):t.slice(head.index+head[0].length);
  let book='';
  const bookM=rest.match(/^КНИГА\s+(\d+)\s*/i);
  if(bookM){book=bookM[1];rest=rest.slice(bookM[0].length)}

  const startM=rest.match(/(?:^|\s)1\s*\.(?!\d)\s*/);

  if(!startM && extractCoordinates(t).length===0){
    const full=t.match(/ПРИП\s+[А-ЯЁ][А-ЯЁ-]*\s+\d+(?:\/\d+)?/i);
    return {skip:true,label:full?full[0]:('ПРИП '+pripNum)};
  }

  const areaRaw=startM?rest.slice(0,startM.index).trim():'';
  const after1=startM?rest.slice(startM.index+startM[0].length):rest;

  const items=parsePointItems(after1);
  const withPts=items.filter(it=>it.pts.length>0);
  const isList=!/РАДИУС/i.test(after1) &&
               !items.some(it=>it.pts.length>=3) &&
               (withPts.length>=2 || (withPts.length===1 && /НЕ\s+ДЕЙСТВУ/i.test(areaRaw+' '+after1)));

  let sec1;
  if(isList){
    sec1=after1.trim();
  }else{
    const endIdx=after1.search(/\s+2\s*\.(?!\d)|\s*ОТМ\s+ЭТОТ/);
    sec1=(endIdx>=0?after1.slice(0,endIdx):after1).trim();
  }
  const body=sec1||t;

  let cancel='';
  const otmM=t.match(/ОТМ\s+ЭТОТ\s+НР\s+(\d{2,6})\s*([А-ЯЁ]+)/i);
  if(otmM){
    const d=otmM[1],mon=otmM[2].toUpperCase();
    if(d.length===6)cancel=`${parseInt(d.slice(0,2),10)} ${monthFull(mon)} в ${d.slice(2,4)}:${d.slice(4,6)}`;
    else if(d.length===4)cancel=`${parseInt(d.slice(0,2),10)} ${monthFull(mon)} в ${d.slice(2,4)}:00`;
    else if(d.length===2)cancel=`${parseInt(d,10)} ${monthFull(mon)} (время не указано)`;
    else cancel=`${d} ${monthFull(mon)}`;
  }

  const notes=[];
  if(/СОБЛЮДАТЬ\s+ОСТОРОЖНОСТЬ/i.test(sec1))notes.push('при плавании соблюдать осторожность');

  if(isList){
    const points=[];
    items.forEach(it=>chunkToPoints(it).forEach(p=>points.push(p)));
    if(!points.length)return {error:'Не удалось выделить координаты объектов',snippet,pripNum,mapNum,city};

    const condIdx=areaRaw.search(/(?:^|\s)(?:ОГН|НЕ\s+ДЕЙСТВУ)/i);
    const sea=condIdx>0?areaRaw.slice(0,condIdx).trim():(condIdx===0?'':areaRaw);
    const cond=condIdx>=0?areaRaw.slice(condIdx).trim():'';
    const typeLabel=cond?capFirst(cond.toLowerCase()):'Навигационное предупреждение (объекты)';
    return{city,pripNum,mapNum,book,area:sea,sec1,typeLabel,period:'',hours:'',cancel,zones:[],singleGeometry:null,points,notes};
  }

  let typeLabel;
  if(/СТРЕЛЬБ|АРТИЛЛЕР|УЧЕНИЯ|ПУСКИ/i.test(sec1)){typeLabel='Стрельбы / Пуски / Учения';}
  else if(/ГИДРОТЕХ/i.test(sec1)){typeLabel='Гидротехнические работы';}
  else if(/ЗАПРЕТ/i.test(sec1)){typeLabel='Запрет плавания';}
  else{typeLabel='Специальные работы';}

  // ИСПРАВЛЕНО: поддержка слитного формата "252100 ПО 312100"
  let period='';
  const pM=sec1.match(/(\d{1,2})(\d{4})?\s+(?:([А-ЯЁ]{3,})\s+)?ПО\s+(\d{1,2})(\d{4})?\s+([А-ЯЁ]{3,})/i);
  if(pM){
    const d1=parseInt(pM[1],10),t1=pM[2],m1=pM[3],d2=parseInt(pM[4],10),t2=pM[5],m2=pM[6];
    let str = m1 ? `${d1} ${monthFull(m1)}` : `${d1}`;
    if(t1) str += ` ${t1.slice(0,2)}:${t1.slice(2,4)}`;
    str += ` – `;
    str += `${d2} ${monthFull(m2)}`;
    if(t2) str += ` ${t2.slice(0,2)}:${t2.slice(2,4)}`;
    period = str;
  }

  let hours='';
  const hM=sec1.match(/(\d{4})\s+ДО\s+(\d{4})/);
  if(hM)hours=`${hM[1].slice(0,2)}:${hM[1].slice(2,4)}–${hM[2].slice(0,2)}:${hM[2].slice(2,4)}`;
  else if(/КРУГЛОСУТОЧНО/i.test(sec1))hours='круглосуточно';

  const zones = [];
  let singleGeometry = null;

  const zoneParts = body.split(/(?=(?<![А-ЯЁA-Z0-9])(?<!\d\s{0,3})[А-ЯA-Z]\.\s*(?:РАЙОН|УЧАСТОК|\d{1,3}\s*-\s*\d{1,2}))/i);

  if (zoneParts.length > 1) {
      const openNames = [];
      for (let i = 1; i < zoneParts.length; i++) {
          const part = zoneParts[i].trim();
          const nameM = part.match(/^([А-ЯA-Z])\./i);
          const name = nameM ? nameM[1].toUpperCase() : String(i);
          const g = buildGeometry(part);
          if (g) {
              zones.push({ name, geometry: g });
              if (g.openBorder) openNames.push(name);
          }
      }
      if (!zones.length) return {error:'Районы найдены, но координаты не распознаны',snippet,pripNum,mapNum,city};
      if (openNames.length) notes.push(`район ${openNames.join(', ')}: контур самопересекается, показана только граница`);
  } else {
      singleGeometry = buildGeometry(body);
      if (!singleGeometry) return {error:'Не удалось выделить координаты района (нужно минимум 2 точки или центр круга)',snippet,pripNum,mapNum,city};
      if (singleGeometry.openBorder) notes.push('контур самопересекается, показана только граница без заливки');
  }

  if(/ДАЛЕЕ\s+ПО\s+БЕРЕГОВОЙ/i.test(sec1))notes.push('участки «далее по береговой линии» заменены прямыми');
  if(/МЕЖДУ\s+БЕРЕГОМ/i.test(sec1))notes.push('линия берега не смоделирована');
  if(/ИСКЛЮЧАЯ\s+ОСТРОВ/i.test(sec1))notes.push('исключение островов не смоделировано');
  if(/ИСКЛЮЧАЯ\s+БЕРЕГОВУЮ/i.test(sec1))notes.push('береговая часть не исключена');

  return{city,pripNum,mapNum,book,area:areaRaw,sec1,typeLabel,period,hours,cancel,zones,singleGeometry,points:[],notes};
}

function geomToKml(g, dLon, dLat){
  const coords = g.pts.map(([lon,lat]) => `              ${(lon+dLon).toFixed(6)},${(lat+dLat).toFixed(6)},0`).join('\n');
  if (g.kind === 'line') {
    return `<LineString><tessellate>1</tessellate><coordinates>\n${coords}\n</coordinates></LineString>`;
  }
  return `<Polygon><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode><outerBoundaryIs><LinearRing><coordinates>\n${coords}\n</coordinates></LinearRing></outerBoundaryIs></Polygon>`;
}

function buildKML(items, isSK42){
  const hexLine = document.getElementById('colorLine').value;
  const hexFill = document.getElementById('colorFill').value;
  const hexPoint = document.getElementById('colorPoint').value;

  const colorLine = hexToKml(hexLine, 'ff');
  const colorFill = hexToKml(hexFill, '4d');
  const colorPoint = hexToKml(hexPoint, 'ff');

  const allPlacemarks = [];
  const dLat = isSK42 ? 0.0014 : 0;
  const dLon = isSK42 ? -0.0020 : 0;

  items.forEach((p, idx) => {
    const rows=[
      `<b>${xmlEscape(p.typeLabel)}</b>`,
      p.period?`<b>Период:</b> ${xmlEscape(p.period)}`:'',
      p.hours?`<b>Время:</b> ${xmlEscape(p.hours)}`:'',
      p.area?`<b>Район:</b> ${xmlEscape(p.area)}`:'',
      p.mapNum?`<b>Карты:</b> ${xmlEscape(p.mapNum)}`:'',
      p.book?`<b>Книга:</b> ${xmlEscape(p.book)}`:'',
      p.cancel?`<b>Отмена:</b> ${xmlEscape(p.cancel)}`:'',
      isSK42?`<i>Внимание! Применена приблизительная поправка СК-42 → WGS-84 (для Баренцева/Белого морей). Для других регионов она может дать ошибку.</i>`:'',
      p.notes.length?`<i>${xmlEscape(p.notes.join('; '))}.</i>`:''
    ].filter(Boolean);

    if (p.points && p.points.length > 0) {
        p.points.forEach(pt => {
            const ptRows = rows.slice();
            ptRows.splice(1, 0, `<b>Объект:</b> ${xmlEscape(pt.name + pt.suffix)}`);
            if (pt.nr) ptRows.splice(2, 0, `<b>НР:</b> ${xmlEscape(pt.nr)}`);
            allPlacemarks.push(`    <Placemark>
      <name>ПРИП ${xmlEscape(p.city)} ${xmlEscape(p.pripNum)}: ${xmlEscape(pt.name + pt.suffix)}</name>
      <description><![CDATA[${ptRows.join('<br/>')}]]></description>
      <styleUrl>#sPoint</styleUrl>
      <Point><coordinates>${(pt.lon+dLon).toFixed(6)},${(pt.lat+dLat).toFixed(6)},0</coordinates></Point>
    </Placemark>`);
        });
    } else if (p.zones && p.zones.length > 0) {
        const desc = rows.join('<br/>');
        p.zones.forEach(z => {
            allPlacemarks.push(`    <Placemark>
      <name>ПРИП ${xmlEscape(p.city)} ${xmlEscape(p.pripNum)} (Район ${xmlEscape(z.name)})</name>
      <description><![CDATA[${desc}]]></description>
      <styleUrl>#sPoly</styleUrl>
      ${geomToKml(z.geometry, dLon, dLat)}
    </Placemark>`);
        });
    } else if (p.singleGeometry) {
        allPlacemarks.push(`    <Placemark>
      <name>ПРИП ${xmlEscape(p.city)} ${xmlEscape(p.pripNum)}</name>
      <description><![CDATA[${rows.join('<br/>')}]]></description>
      <styleUrl>#sPoly</styleUrl>
      ${geomToKml(p.singleGeometry, dLon, dLat)}
    </Placemark>`);
    }
  });

  const styles = `
    <Style id="sPoly">
      <LineStyle><color>${colorLine}</color><width>2</width></LineStyle>
      <PolyStyle><color>${colorFill}</color></PolyStyle>
    </Style>
    <Style id="sPoint">
      <IconStyle><color>${colorPoint}</color><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle>
      <LabelStyle><scale>0.8</scale></LabelStyle>
    </Style>
  `;

  const firstName=items.length===1?`ПРИП ${items[0].city} ${items[0].pripNum}`:`ПРИП (${items.length} сообщений)`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${xmlEscape(firstName)}</name>
    <description><![CDATA[Сгенерировано из текста ПРИП. Полигоны упрощены.]]></description>
${styles}
${allPlacemarks.join('\n')}
  </Document>
</kml>`;
}

const input=document.getElementById('input');
const parseBtn=document.getElementById('parse');
const dlBtn=document.getElementById('download');
const clearBtn=document.getElementById('clear');
const preview=document.getElementById('preview');
const sk42Checkbox=document.getElementById('sk42');
let parsed=[];

clearBtn.onclick=()=>{
  input.value='';
  preview.innerHTML='';
  parsed=[];
  dlBtn.disabled=true;
  input.focus();
};

parseBtn.onclick=()=>{
  preview.innerHTML='';parsed=[];dlBtn.disabled=true;
  let text=input.value.trim();
  if(!text)return;

  text = text.replace(/[–—‑]/g, '-');
  text = text.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ');
  text = fixOcr(text);
  text = text.replace(/([^\s\d\-.,])([12]\s*\.)/g, '$1 $2');
  text = text.replace(/([^\s])ПРИП\s+/gi, '$1 ПРИП ');

  // ИСПРАВЛЕНО: поддержка дефиса в названии города
  const parts=text.split(/(?=ПРИП\s+[А-ЯЁ][А-ЯЁ-]*\s+\d+(?:\/\d+)?\s+КАРТ[АЫ])/i).map(s=>s.trim()).filter(s=>s);

  if(!parts.length){preview.innerHTML='<div class="err">Не найдено сообщений ПРИП.</div>';return}

  for(const p of parts){
    const r=parseOne(p);
    if(!r){continue}
    if(r.skip){
      preview.insertAdjacentHTML('beforeend',`<p class="skip">Служебный заголовок пропущен: ${xmlEscape(r.label)}</p>`);
      continue;
    }
    if(r.error){
      preview.insertAdjacentHTML('beforeend',`<div class="card"><h3>ПРИП ${xmlEscape(r.pripNum)}</h3><div class="err">${xmlEscape(r.error)}</div>${r.snippet?`<p style="font-size:11px;color:#aaa">Фрагмент: ${xmlEscape(r.snippet)}…</p>`:''}</div>`);
      continue;
    }
    parsed.push(r);

    let coordsStr = '';
    if (r.zones && r.zones.length > 0) {
        coordsStr = `<p><b>Найдено районов:</b> ${r.zones.length}</p>`;
        r.zones.forEach(z => {
            coordsStr += `<div class="zone-box"><b>Район ${xmlEscape(z.name)}</b>${describeGeom(z.geometry)}</div>`;
        });
    } else if (r.points && r.points.length > 0) {
        const list = r.points.map(pt => `${pt.n}. ${xmlEscape(pt.name + pt.suffix)} — ${formatDM(pt.lat, true)}, ${formatDM(pt.lon, false)}${pt.nr ? ', НР ' + xmlEscape(pt.nr) : ''}`).join('<br>');
        coordsStr = `<p><b>Объектов:</b> ${r.points.length}</p><p style="font-size:12px;color:#aaa;margin-top:2px">${list}</p>`;
    } else if (r.singleGeometry) {
        coordsStr = describeGeom(r.singleGeometry);
    }

    preview.insertAdjacentHTML('beforeend',`<div class="card">
      <h3>ПРИП ${xmlEscape(r.city)} ${xmlEscape(r.pripNum)}</h3>
      <div class="row">
        <span class="tag">${xmlEscape(r.typeLabel)}</span>
        ${r.period?`<span class="tag">${xmlEscape(r.period)}</span>`:''}
        ${r.hours?`<span class="tag">${xmlEscape(r.hours)}</span>`:''}
      </div>
      <p><b>Район:</b> ${xmlEscape(r.area||'—')}</p>
      <p><b>Карты:</b> ${xmlEscape(r.mapNum)}${r.book ? ' · <b>Книга:</b> ' + xmlEscape(r.book) : ''}</p>
      ${coordsStr}
      ${r.cancel?`<p><b>Отмена:</b> ${xmlEscape(r.cancel)}</p>`:''}
      ${r.notes.length?`<p style="color:#888"><i>${xmlEscape(r.notes.join('; '))}.</i></p>`:''}
    </div>`);
  }
  dlBtn.disabled=parsed.length===0;
};

dlBtn.onclick=()=>{
  if(!parsed.length)return;
  const applySK42 = sk42Checkbox.checked;
  const kml=buildKML(parsed, applySK42);
  
  let name = '';
  if (parsed.length === 1) {
      name = `ПРИП - ${parsed[0].city} ${parsed[0].pripNum}.kml`;
  } else {
      const parts = parsed.map(p => `${p.city} ${p.pripNum}`);
      const cities = [...new Set(parsed.map(p => p.city))];
      if (cities.length === 1) {
          name = `ПРИП - ${cities[0]} (${parsed.map(p=>p.pripNum).join(', ')}).kml`;
      } else {
          name = `ПРИП - ${parts.join(', ')}.kml`;
      }
  }
  if (name.length > 100) name = 'ПРИП - Сборник.kml';

  const blob=new Blob([kml],{type:'application/vnd.google-earth.kml+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};

if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
